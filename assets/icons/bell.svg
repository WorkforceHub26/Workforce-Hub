  <!-- Left Ringing Green Sound Wave Bracket -->
  <path d="M125 198 c-9-19-15-40-15-62 0-14 2-27 6-39" fill="none" stroke="#156832" stroke-width="26" stroke-linecap="round" />

  <!-- Right Ringing Green Sound Wave Bracket -->
  <path d="M387 198 c9-19 15-40 15-62 0-14-2-27-6-39" fill="none" stroke="#156832" stroke-width="26" stroke-linecap="round" />

  <!-- Bottom Clapper (Tongue) -->
  <!-- Clapper Left Half -->
  <path d="M256 400 c-30 0-54 21-54 48 0 16 9 30 23 39 h31 v-87 Z" fill="#c47d00" />
  <!-- Clapper Right Half -->
  <path d="M256 400 c30 0 54 21 54 48 0 16-9 30-23 39 h-31 v-87 Z" fill="#a46200" />

  <!-- Bell Body Left Side (Brighter Gold) -->
