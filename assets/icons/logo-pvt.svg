<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290">
  <rect width="500" height="290" fill="#ffffff" />
  <g>
    <!-- Outer Rectangle Frame -->
    <rect x="50" y="20" width="400" height="185" fill="none" stroke="#000078" stroke-width="7" />

    <!-- Solid Horizontal Bar extending past left frame -->
    <rect x="18" y="115" width="432" height="65" fill="#000078" />

    <!-- White gap mask around Hexagon -->
    <polygon points="325,35 395,35 430,95 395,155 325,155 290,95" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="miter" />

    <!-- Solid Navy Blue Hexagon -->
    <polygon points="325,35 395,35 430,95 395,155 325,155 290,95" fill="#000078" />
  </g>

  <!-- Company Name Text Below -->
  <text x="250" y="260" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="33" fill="#000078" text-anchor="middle" letter-spacing="1">P.V.T.&amp;T. PLAS CO.,LTD.</text>
</svg>
