<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8bf9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
    <clipPath id="avatarClip">
      <circle cx="21" cy="32" r="12" />
    </clipPath>
  </defs>

  <!-- Lanyard hole slot at top -->
  <rect x="25" y="4" width="14" height="4" rx="2" fill="#93c5fd" opacity="0.8" />

  <!-- ID Card Base -->
  <rect x="5" y="9" width="54" height="46" rx="9" fill="url(#cardGrad)" filter="url(#cardShadow)" />
  
  <!-- Subtle inner card border -->
  <rect x="6.5" y="10.5" width="51" height="43" rx="7.5" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" />

  <!-- Avatar Circle Container -->
  <circle cx="21" cy="32" r="13" fill="#ffffff" />
  
  <!-- Avatar Portrait (Clipped) -->
  <g clip-path="url(#avatarClip)">
    <!-- Face / Head -->
    <circle cx="21" cy="27" r="6" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M15 26 C15 20, 27 20, 27 26 C26 23, 23 21, 21 21 C18 21, 16 23, 15 26 Z" fill="#451a03" />
    <!-- Shirt / Shoulders -->
    <ellipse cx="21" cy="42" rx="9" ry="7" fill="#6366f1" />
    <!-- Shirt Collar -->
    <path d="M19 35 L21 38 L23 35 Z" fill="#ffffff" />
  </g>

  <!-- Right Details: Name Badge & Data Rows -->
  <!-- Name block -->
  <rect x="36" y="20" width="19" height="7" rx="3.5" fill="#0f172a" />
  <!-- Info Row 1 -->
  <rect x="36" y="30" width="19" height="3.5" rx="1.75" fill="#dbeafe" />
  <!-- Info Row 2 -->
  <rect x="36" y="36" width="14" height="3.5" rx="1.75" fill="#bfdbfe" />
  <!-- Info Row 3 -->
  <rect x="36" y="42" width="17" height="3.5" rx="1.75" fill="#93c5fd" />
</svg>
