    <circle cx="174" cy="320" r="14" fill="#009bf9" />
    <circle cx="234" cy="320" r="14" fill="#009bf9" />
    
    <circle cx="278" cy="320" r="14" fill="#009bf9" />
    <circle cx="338" cy="320" r="14" fill="#e81e62" />
    <circle cx="398" cy="320" r="14" fill="#e81e62" />

    <!-- Dots Row 2 -->
