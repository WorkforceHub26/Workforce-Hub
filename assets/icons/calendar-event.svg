    <rect x="56" y="160" width="200" height="360" fill="#ffffff" />
    
    <!-- Right Light Blue Page -->
    <rect x="256" y="160" width="200" height="360" fill="#eaf6f6" />
    
    <!-- Left Dark Header -->
