<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
  </defs>

  <!-- Yellow Circle Base -->
  <circle cx="256" cy="256" r="248" fill="#ffc107" />

  <!-- Diagonal Long Shadow (clipped to circle) -->
  <g clip-path="url(#circleClip)">
    <path d="M370 70 L512 212 L512 512 L220 512 L150 440 L370 70 Z" fill="#ffa000" opacity="0.85" />
  </g>

  <!-- Top Paper Sheet (Input Tray) -->
  <path d="M140 70 h232 v140 H140 Z" fill="#263238" />

  <!-- Top Dark Printer Head Cover Slot -->
  <path d="M110 160 h292 v45 H110 Z" fill="#1e252b" opacity="0.3" />

  <!-- Main Printer Body (Charcoal/Dark Slate) -->
  <rect x="70" y="160" width="372" height="195" rx="42" fill="#374151" />

  <!-- Printer Right Half Shading (Subtle 3D Division) -->
  <path d="M256 160 h144 c23.2 0 42 18.8 42 42 v111 c0 23.2-18.8 42-42 42 H256 Z" fill="#1f2937" opacity="0.3" />

  <!-- Front Output Slot -->
  <rect x="135" y="275" width="242" height="18" rx="8" fill="#111827" />

  <!-- Output Paper Sheet (White Paper with 3D Fold/Shading) -->
  <g>
    <!-- Left Half of Paper (Bright White) -->
    <path d="M156 310 h100 v130 H156 Z" fill="#ffffff" />
    <!-- Right Half of Paper (Slightly shaded white) -->
    <path d="M256 310 h100 v130 H256 Z" fill="#f1f5f9" />
  </g>

  <!-- Dual Cyan Indicator LED Lights on Left Face -->
  <circle cx="118" cy="245" r="14" fill="#22d3ee" />
  <circle cx="156" cy="245" r="14" fill="#22d3ee" />
</svg>
